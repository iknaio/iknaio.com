{{ define "main" }}
<section class="hero hero--compact section" aria-labelledby="contact-heading">
  <div class="container hero-inner">
    <h1 id="contact-heading" class="hero-title">Get in Touch</h1>
    <p class="hero-subtitle">Fill in the form to get your Iknaio account, or write to us directly.</p>
  </div>
</section>

<section class="section section-contact">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-form-wrap" id="book-demo">
        <iframe src="{{ .Site.Params.odoo_form }}" class="contact-iframe" title="Get access form" loading="lazy" fetchpriority="auto" referrerpolicy="no-referrer" sandbox="allow-same-origin allow-scripts allow-downloads allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-storage-access-by-user-activation allow-top-navigation-by-user-activation"></iframe>
      </div>

      <div class="contact-sidebar">
        <div class="contact-info-block">
          <h3>Contact Information</h3>
          <dl class="contact-details">
            <dt>Email</dt>
            <dd><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a></dd>
            <dt>Address</dt>
            <dd>
              Iknaio Cryptoasset Analytics GmbH<br>
              Metternichgasse 8<br>
              1030 Vienna, Austria
            </dd>
          </dl>
        </div>
      </div>
    </div>
  </div>
</section>
{{ end }}
